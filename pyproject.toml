[project]
name = "bil-mcp"
version = "0.1.0"
description = "MCP server for searching and inspecting datasets in the Brain Image Library (BIL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Katarzyna M. Kedziora" }]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
bil-mcp = "bil_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bil_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real BIL API (run with: pytest -m live)"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning"]
